# fly apps create <name> && fly secrets set REMBG_TOKEN=... && fly deploy --remote-only
app = "ai-product-content-demo-rembg"
primary_region = "fra"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # scale to zero when idle
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
